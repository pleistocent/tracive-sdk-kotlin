# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Published coordinates. Group is `id.tracive` (the company's domain, reversed); the Kotlin package
# is `id.tracive.sdk`. They differ, and that is intentional rather than an oversight — the package
# was fixed first and renaming it now would break every import in the Flutter and Swift bridge code
# that already refers to it.
tracive.group=id.tracive
tracive.version=0.1.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
