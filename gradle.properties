# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Published as `com.pleistocent:tracive-sdk`, under the namespace verified for this account on
# Maven Central. The Kotlin package is `id.tracive.sdk`; they differ on purpose — the package was
# fixed first and renaming it would break every import in the Flutter and Swift bridge code.
tracive.group=com.pleistocent
tracive.version=0.2.1

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
