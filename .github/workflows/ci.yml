name: CI

# ---------------------------------------------------------------------------------------------
# CI IS OFF — re-enable when there is budget for it.
#
# This repository is private, so Actions minutes are metered — and this workflow runs on macOS
# runners, which bill at a multiple of the Linux rate, so it is the expensive one. Nothing below
# has been deleted; only the triggers changed. To turn automatic runs back on, restore:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
# Until then the gates still exist as commands — they are the `run:` steps below, and every one of
# them works on a laptop. Run them before pushing, because with this off nothing else will.
# ---------------------------------------------------------------------------------------------

on:
  # Manual only, so a run costs something only when someone asks for it. See the note above.
  workflow_dispatch:

# A force-push or a quick second commit should not leave two runs racing for the same cache.
# The in-progress run for a PR is cancelled; runs on main are not, so main keeps a full history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # macOS, because this is where the Apple targets are. A Linux runner can compile the Android
    # target and run the common tests, but it cannot build iosArm64 / iosSimulatorArm64 / iosX64 at
    # all — and those are half of what this SDK ships. A green Linux build would be a green build of
    # something nobody installs.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the shared cache. A PR reads it but cannot poison it, which matters
          # because a PR runs code from a fork.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The fixture itself, pinned by content hash.
      #
      # `query-grammar-vectors.json` is vendored byte-identically into four SDK repositories and its
      # expected values were produced by the server's own key normalizer, so this file is a shared
      # contract rather than test data — an edit here is a change to what four clients agree the
      # server does. The hash is the same one the sibling repositories pin.
      #
      # The step below this one does currently notice an edit to the JSON, because the embedded
      # Kotlin copy is regenerated from it and diffed. That is protection by side effect: it is
      # aimed at drift between the two copies, it says nothing about the fixture in the CI log, and
      # it would disappear the day the embedded copy is generated differently or at build time.
      # Reading ci.yml would not have told you the fixture was protected at all. This step says so.
      #
      # If it fails, the fix is never to update the hash on its own. A grammar change starts at the
      # Tracive API and lands in all four SDKs together, and the hash moves in all four with it.
      - name: Verify the query-grammar fixture is unmodified
        run: |
          echo "e63439047455e20e0952d75ad438ec8c7b2f80e8b1872c5e6c47628daab89bfe  tracive-sdk/src/commonTest/resources/query-grammar-vectors.json" \
            | shasum -a 256 --check --strict

      # The phone-normalization fixture, pinned the same way and for the same reason. Its expected
      # values were produced by the Tracive app's own normalizer, so it is the contract that keeps
      # app and SDK folding one person to one record key. It shipped without either protection on
      # 2 August 2026 and an audit proved it: replacing the JSON with a contradictory file left
      # `./gradlew check` green, because nothing read it.
      # Public-hygiene scan. This repository's CONTRIBUTING used to say "there is no automated scan
      # here, which puts it on you and on the reviewer" — and on 2 August 2026 the reviewer (the
      # author) shipped 39 Indonesian-language fixture notes into four published repositories.
      # React Native's scanner caught them; the other three took the same file without a word.
      #
      # The script proves every rule can still fire before it scans anything, against its own
      # self-test corpus, and refuses to run if one matches nothing. A check that cannot fail is
      # worse than no check, because it reads as coverage.
      - name: Public-hygiene scan
        run: node tools/check-hygiene.js

      - name: Verify the phone-normalization fixture is unmodified
        run: |
          echo "b060199bb1785662c8e2670aecc38fc03ef6ebfad845a98ff37ad3c3308f903f  tracive-sdk/src/commonTest/resources/phone-normalization-vectors.json" \
            | shasum -a 256 --check --strict

      - name: Check the embedded phone vectors match the JSON
        run: |
          python3 tools/generate_phone_vectors_kt.py
          git diff --exit-code tracive-sdk/src/commonTest/kotlin/id/tracive/sdk/query/PhoneNormalizationTest.kt

      # The embedded copy of the grammar fixture must be the fixture. Kotlin Multiplatform cannot
      # read a test resource from commonTest, so `QueryGrammarVectorsJson.kt` carries the file as a
      # constant — and a constant that drifts from the JSON beside it is exactly the silent failure
      # the fixture exists to prevent: the tests would keep passing against a stale contract. The
      # generator is deterministic, so regenerating and diffing is the whole check.
      - name: Check the embedded grammar fixture matches the JSON
        run: |
          python3 tools/generate_vectors_kt.py
          git diff --exit-code -- tracive-sdk/src/commonTest/kotlin/id/tracive/sdk/QueryGrammarVectorsJson.kt

      # The bank-code table the SDK ships, pinned and embedded the same way as the grammar fixture.
      # It is the Tracive API's own table, vendored verbatim into all four SDKs, so the hash moves in
      # all four together. `BankCodesVendoredFileTest` also compares the two copies on every test run.
      - name: Check the bank-code table is unmodified and embedded
        run: |
          echo "77eda1e45ec5d2894d9a676452f98470fa2c337d6ea12ab628ff176e62e740d5  tracive-sdk/src/commonTest/resources/bank-codes.json" \
            | shasum -a 256 --check --strict
          python3 tools/generate_bank_codes_kt.py
          git diff --exit-code -- tracive-sdk/src/commonMain/kotlin/id/tracive/sdk/query/BankCodesJson.kt

      # Verified before anything else that needs a compiler, because it is the cheapest check that
      # can fail and the one most likely to. ktfmt Google style, 2-space indent. `./gradlew
      # ktfmtFormat` fixes it.
      - name: Check formatting
        run: ./gradlew ktfmtCheck

      # The public surface, pinned — both halves of it. `api/tracive-sdk.klib.api` covers the Apple
      # targets and `api/tracive-sdk.android.api` covers the Android one, which is where most
      # partners integrate. A change here is not necessarily wrong; it is necessarily deliberate. If
      # this fails, run `./gradlew apiDump` and review the diff. The review is the point, because
      # partner apps upgrade on their own schedule and an accidental signature change is a broken
      # build in someone else's release train.
      - name: Check public API surface
        run: ./gradlew apiCheck

      # The common test suite, on the JVM. Fastest signal, and it covers query folding, the cache,
      # TTL policy and error mapping — everything that does not need a device.
      #
      # Every test in this repo runs with no network. The HTTP transport is an injected interface
      # and the suite runs against a fake. There is no live backend to hit, and a suite that needed
      # one could not run here anyway.
      - name: Run common tests (JVM)
        run: ./gradlew :tracive-sdk:testAndroidHostTest

      # The same common tests again, compiled by Kotlin/Native and run on the simulator target.
      # Not redundant: this SDK implements SHA-256 and AES-GCM in common Kotlin specifically so a
      # cache record written on Android opens byte-for-byte on iOS, and that claim is only tested if
      # the vectors are checked by the Native backend too. Integer and byte semantics are where the
      # two would drift.
      - name: Run common tests (iOS simulator)
        run: ./gradlew :tracive-sdk:iosSimulatorArm64Test

      # Compiles every target, links the Apple frameworks, and runs `check` on the whole tree —
      # including the sample app, which is a separate Gradle project depending on `:tracive-sdk` the
      # way a partner would. A change that compiles only because it can see the library's internals
      # fails here rather than in a partner's build.
      - name: Build all targets
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
